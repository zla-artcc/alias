name: Generate TEC Route Aliases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      next_cycle:
        description: "Use next AIRAC cycle instead of current"
        type: boolean
        default: false

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    name: Generate TEC routes and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Evaluate 28-day cadence
        if: github.event_name == 'schedule'
        id: cadence
        run: |
          anchor_date="2026-02-16"
          current_date="$(date -u +%F)"
          anchor_epoch="$(date -u -d "$anchor_date" +%s)"
          current_epoch="$(date -u -d "$current_date" +%s)"
          day_delta="$(( (current_epoch - anchor_epoch) / 86400 ))"
          modulo="$(( day_delta % 28 ))"
          should_run="false"
          if [ "$day_delta" -ge 0 ] && [ "$modulo" -eq 0 ]; then
            should_run="true"
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      # Run 3 days before the next cycle takes effect
      - name: Skip non-cycle day
        if: github.event_name == 'schedule' && steps.cadence.outputs.should_run != 'true'
        run: echo "Skipping - not a 28-day boundary from 2026-02-16."

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.cadence.outputs.should_run == 'true'

      - name: Clone techno
        if: github.event_name != 'schedule' || steps.cadence.outputs.should_run == 'true'
        run: git clone https://x-access-token:${{ secrets.INTERNAL_REPO_PAT }}@github.com/zla-artcc/techno.git

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.cadence.outputs.should_run == 'true'
        with:
          python-version: "3.13"

      - name: Install techno
        if: github.event_name != 'schedule' || steps.cadence.outputs.should_run == 'true'
        run: pip install ./techno

      - name: Generate TEC routes
        if: github.event_name != 'schedule' || steps.cadence.outputs.should_run == 'true'
        env:
          ALIAS_REPO_PATH: ./alias-tec-routes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.next_cycle }}" = "true" ]; then
            techno --next-cycle generate
          else
            techno generate
          fi

      - name: Create branch and open PR
        if: github.event_name != 'schedule' || steps.cadence.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AIRAC=$(date -u +%y%m)
          BRANCH="tec-routes-${AIRAC}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add alias-tec-routes/
          if git diff --cached --quiet; then
            echo "No TEC route changes detected."
            exit 0
          fi
          git commit -m "Update TEC routes for AIRAC ${AIRAC}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Update TEC routes for AIRAC ${AIRAC}" \
            --body "Automated TEC route update generated by techno." \
            --reviewer zladatm
